#workflow name
name: ERP Backend CI

#code action name
on:
  push:

  pull_request:
    branches:
      - main
jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Node setup
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install dependencies
        run: npm ci

      - name: build project 
        run : npm run build
